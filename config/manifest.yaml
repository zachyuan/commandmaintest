# ComfyUI Commander Manifest
# Use this to define your "Scenes" (Workflows groups)

workflows_repo: "https://github.com/zachyuan/sync_docker.git"

# Define different scenes to optimize startup time
# Each scene downloads only what it needs
scenes:
  MiniMax-H3:
    nodes:
      - "https://github.com/chflame163/ComfyUI_LayerStyle.git"
      - "https://github.com/chflame163/ComfyUI_LayerStyle_Advance.git"
      - "https://github.com/ethanfel/ComfyUI-MiniMaxH3-Context-Loop.git"
      - "https://github.com/kijai/ComfyUI-KJNodes.git"
      - "https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git"
    models:
      - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
        path: models/text_encoders
        name: qwen3vl_32b_minimax_h3_int8_convrot.safetensors
      - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
        path: models/vae
        name: minimax_h3_audio_vae_fp32.safetensors
      - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_int8_convrot.safetensors
        path: models/vae
        name: minimax_h3_video_vae_int8_convrot.safetensors
      - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
        path: models/diffusion_models/Minimax-H3
        name: minimax_h3_ref2va_pruned_int8_convrot.safetensors
      - url: https://huggingface.co/Kijai/MiniMax-H3-experimental/resolve/main/loras/MiniMax-H3-Ref2VA-Acc-8Step_pruned_comfy.safetensors
        path: models/loras/Minimax
        name: MiniMax-H3-Ref2VA-Acc-8Step_pruned_comfy.safetensors
      # - url: https://huggingface.co/Comfy-Org/MiniMax-H3/blob/main/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
      #   path: models/text_encoders
      #   name: qwen3vl_32b_minimax_h3_int8_convrot.safetensors
      # - url: https://huggingface.co/Comfy-Org/MiniMax-H3/blob/main/vae/minimax_h3_audio_vae_fp32.safetensors
      #   path: models/vae
      #   name: minimax_h3_audio_vae_fp32.safetensors
      # - url: https://huggingface.co/Comfy-Org/MiniMax-H3/blob/main/vae/minimax_h3_video_vae_int8_convrot.safetensors
      #   path: models/vae
      #   name: minimax_h3_video_vae_int8_convrot.safetensors
      # - url: https://huggingface.co/Comfy-Org/MiniMax-H3/blob/main/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
      #   path: models/diffusion_models/Minimax-H3
      #   name: minimax_h3_ref2va_pruned_int8_convrot.safetensors
      # - url: https://huggingface.co/Kijai/MiniMax-H3-experimental/blob/main/loras/MiniMax-H3-Ref2VA-Acc-8Step_pruned_comfy.safetensors
      #   path: models/loras/Minimax
      #   name: MiniMax-H3-Ref2VA-Acc-8Step_pruned_comfy.safetensors
    pips: ["sageattention"]

