    # If not in pool, will be git cloned automatically
    nodes:
      - "https://github.com/Comfy-Org/ComfyUI-Manager.git"
      # - "https://github.com/ltdrdata/ComfyUI-Impact-Pack.git"
      # - "https://github.com/city96/ComfyUI-GGUF.git"
    
