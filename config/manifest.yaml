# ComfyUI Commander Manifest
# Use this to define your "Scenes" (Workflows groups)

workflows_repo: "https://github.com/your-user/your-private-workflow-repo.git"

# Define different scenes to optimize startup time
# Each scene downloads only what it needs
scenes:
  flux_dev:
